# Proje Klasör Yapısı

## Ana Klasörler
- SKILL/ - Skill gem verileri (8 dosya)
- ASCENDANCY/ - Ascendancy verileri (1 dosya)
- UNIQUE/ - Unique item verileri (3 dosya)

## Veri Klasörleri
- KEYWORDS/ - Anahtar kelimeler
- CONSTITUTION/ - Kurallar ve anayasa
- FUTURE_MECHANICS/ - Gelecek mekanikler

## İşlem Klasörleri
- DATA/ - İşlenmiş veriler
  - raw/ - Ham veriler
  - processed/ - Temizlenmiş veriler
  - merged/ - Birleştirilmiş veriler

- SRC/ - Kaynak kodlar
  - cleaners/ - Veri temizleyiciler
  - analyzers/ - Analizörler
  - validators/ - Doğrulayıcılar
  - reports/ - Rapor oluşturucular

- OUTPUTS/ - Çıktılar
  - reports/ - Raporlar
  - archive/ - Arşivler
  - web/ - Web dosyaları

- SCRIPTS/ - Çalıştırma scriptleri
- CONFIG/ - Yapılandırma
