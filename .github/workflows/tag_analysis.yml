name: PoE2 Tag Analysis

on:
  push:
    paths:
      - 'SKILL/*.csv'
      - 'UNIQUE/*.csv'
      - 'ASCENDANCY/*.csv'
      - 'SRC/**'
      - 'CONSTITUTION/**'
      - 'SCRIPTS/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: 📥 Repoyu çek
      uses: actions/checkout@v4
    
    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Bağımlılıkları yükle
      run: |
        pip install pandas numpy
    
    - name: 📂 Verileri düzenle
      run: |
        python SCRIPTS/organize_data.py
    
    - name: 🔍 Etiket analizini çalıştır
      run: |
        python SCRIPTS/run_tag_analysis.py
    
    - name: 📊 Raporları kontrol et
      run: |
        echo "📁 DATA/processed/ klasörü:"
        ls -la DATA/processed/ 2>/dev/null || echo "  (klasör boş veya yok)"
        echo ""
        echo "📁 OUTPUTS/reports/daily/ klasörü:"
        ls -la OUTPUTS/reports/daily/ 2>/dev/null || echo "  (klasör boş veya yok)"
        echo ""
        echo "📁 CONSTITUTION/ klasörü:"
        ls -la CONSTITUTION/ 2>/dev/null || echo "  (klasör boş veya yok)"
    
    - name: 🧮 Muhasebeci Ajanını Test Et
      run: |
        python SCRIPTS/test_accountant.py
    
    - name: 🎯 En iyi support kombinasyonunu bul
      run: |
        python SCRIPTS/find_best_supports.py
    
    - name: ⚔️ Tam Sistem Çalıştır
      run: |
        python SCRIPTS/run_full_system.py
    
    - name: 💾 Sonuçları kaydet
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "Tag Analyzer Bot"
        
        git add DATA/processed/ 2>/dev/null || true
        git add OUTPUTS/reports/ 2>/dev/null || true
        git add CONSTITUTION/ 2>/dev/null || true
        git add OUTPUTS/web/ 2>/dev/null || true
        
        if ! git diff --cached --quiet; then
          git commit -m "🏷️ Günlük tag analizi: $(date +'%Y-%m-%d')"
          git push
        else
          echo "📝 Değişiklik yok, commit atlanıyor."
        fi
