- name: 💾 Sonuçları kaydet
  run: |
    git config --local user.email "github-actions[bot]@users.noreply.github.com"
    git config --local user.name "Tag Analyzer Bot"
    # Sadece var olan dosyaları ekle
    git add DATA/processed/ || true
    git add OUTPUTS/reports/ || true
    git add OUTPUTS/web/ || true
    # Değişiklik varsa commit, yoksa atla
    git diff --cached --quiet || git commit -m "🏷️ Günlük tag analizi: $(date +'%Y-%m-%d')" || echo "No changes to commit"
    git push || echo "No changes to push"
