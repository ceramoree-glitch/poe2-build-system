name: PoE2 Tag Analysis

on:
  push:
    paths:
      - 'SKILL/*.csv'
      - 'UNIQUE/*.csv'
      - 'ASCENDANCY/*.csv'
      - 'SRC/**'
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: 📥 Repoyu çek
      uses: actions/checkout@v4
    
    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Bağımlılıkları yükle
      run: |
        pip install pandas numpy
    
    - name: 🔍 Etiket analizini çalıştır
      run: |
        python SCRIPTS/run_tag_analysis.py
    
    - name: 📊 Raporları kontrol et
      run: |
        ls -la DATA/processed/
        ls -la OUTPUTS/reports/daily/
    
    - name: 💾 Sonuçları kaydet
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "Tag Analyzer Bot"
        git add DATA/processed/ OUTPUTS/reports/
        git diff --cached --quiet || git commit -m "🏷️ Günlük tag analizi: $(date +'%Y-%m-%d')"
        git push
